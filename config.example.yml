# Copy this file to `config.yml` and edit as needed. Every value below is
# optional: anything omitted falls back to the built-in defaults shown here,
# so an empty or missing config.yml reproduces the original behavior.

logging:
  # One of: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level: INFO
  max_bytes: 10485760   # 10 MiB
  backup_count: 5
  # Optional log file path (relative paths resolve against the project root).
  # Usually set via LOG_FILE in .env instead.
  # file: backend.log

cors:
  # Allowed browser origins for the API. Accepts a YAML list or a comma-separated
  # string.
  allow_origins:
    - http://127.0.0.1:3000
    - http://localhost:3000
  allow_methods:
    - GET
    - POST
  allow_headers:
    - "*"
  # Response headers the browser will let JS read cross-origin. X-Kills-Fresh-To
  # drives the frontend's delta-poll `since`; without exposing it,
  # response.headers.get("X-Kills-Fresh-To") returns null in the browser.
  expose_headers:
    - X-Kills-Fresh-To

database:
  # asyncpg connection pool sizing.
  pool_min_size: 5
  pool_max_size: 20
  # Startup ride-out of a transient DB outage (e.g. a package-day Postgres
  # restart): retry pool creation with exponential backoff for up to
  # connect_max_retry_seconds (0 = no retry), each sleep capped at
  # connect_retry_max_delay_seconds, then fail loudly.
  connect_max_retry_seconds: 60
  connect_retry_max_delay_seconds: 10

cache:
  # All values are TTLs in seconds for the Redis cache layer.
  query_ttl: 300            # generic query response cache
  binary_ttl: 300           # per-system binary kills payload (since=None); cached once per TTL
  type_name_ttl: 2592000    # DB type-name lookups (30 days)
  esi_corp_ttl: 86400       # ESI corporation info (1 day)
  esi_alliance_ttl: 86400   # ESI alliance info (1 day)
  esi_sov_fallback_ttl: 3600    # sov map when no Expires header (1h)
  rankings_ttl: 3600        # /stats/system-rankings response
  sov_ttl: 3600             # /systems/{id}/sov response
  farthest_kill_ttl: 21600  # /systems/{id}/farthest_kill response (6h)
  kill_detail_ttl: 604800   # per-killmail raw detail (immutable; 7 days)
  kill_detail_processed_ttl: 3600   # processed kill detail
  system_latest_ttl: 10     # per-system MAX(inserted_time) short-circuit cache
  filtered_map_ttl: 1800    # /stats/system-kills response when f= filters are applied
  filtered_system_ttl: 15   # /systems/{id}/kills/filtered response
  autocomplete_ttl: 60      # entity/ship/weapon autocomplete responses
  war_search_ttl: 60        # war search responses
  war_details_ttl: 21600    # /wars/details per-id cache (6h)
  esi_sov_structures_fallback_ttl: 3600  # sov structures (ADM) when no Expires header (1h)
  sov_map_ttl: 3600                      # /universe/sov response
  warm_on_signal: true   # proactively warm MV-derived defaults on the leader

cache_redis:
  # Connection pool for the response/ESI cache Redis (REDIS_CACHE_URL). A blocking
  # pool: when all connections are busy, a request waits up to pool_timeout for a
  # free one instead of erroring. On any Redis error (timeout, pool exhaustion,
  # connection loss) the cache degrades to a DB read rather than failing the request.
  max_connections: 200        # per-worker cap on concurrent cache-Redis connections
  pool_timeout: 5             # seconds a request waits for a free connection
  socket_connect_timeout: 5   # seconds to establish a connection
  socket_timeout: 10          # seconds to wait on a read/write
  socket_keepalive: true
  health_check_interval: 30   # seconds between idle-connection health checks

streaming:
  # Cross-app contract names shared with process-kills. Do not change without
  # updating process-kills in lockstep.
  stream_name: kills:live          # Redis stream the backend tails
  pubsub_channel: kills:enriched   # internal fan-out channel between workers
  invalidate_channel: cache:invalidate   # cache-invalidation pub/sub

health:
  # Per-worker heartbeat interval and key TTL (seconds). TTL should be >= 2x interval.
  heartbeat_interval: 10
  heartbeat_ttl: 30
  # Optional: if set, /health/detail flags "degraded" when fewer workers report.
  # expected_workers: 4

limits:
  # Input caps to bound abuse / resource use.
  max_killmail_ids: 100      # /kills/details/raw ids per request
  max_name_ids: 100          # POST /universe/names ids per request
  max_ws_connections: 1000   # per-process WebSocket connection cap
  max_filter_conditions: 8           # max f= conditions per faceted-filter request
  max_filter_ids_per_condition: 50   # max ids within a single f= condition
  autocomplete_min_length: 3         # minimum query length for autocomplete endpoints
  max_war_results: 500               # max results returned by war search
  max_war_ids: 200                   # max war ids per /wars/details request
  encode_offload_min_rows: 2000      # offload the binary kills encode to a thread at/above this row count
  system_rankings_default_limit: 10
  global_kills_default_bins: 300

metrics:
  # Expose a Prometheus scrape endpoint (/metrics) on host:port. Off by default
  # (enabling opens a listening socket). Application-level metrics only; Postgres
  # and redis internals come from a separate DB exporter.
  enabled: false
  host: 0.0.0.0
  # Usually set via METRICS_PORT in .env instead.
  #port: 9108
